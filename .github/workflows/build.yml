name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The feed parser decides what date every episode sorts by and which files
      # count as episodes at all. A regression there silently scrambles a library
      # rather than crashing, so the tests gate the build instead of running beside it.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # No signingConfig in the release build type, so this lands as -unsigned and is
      # signed below. Debug APKs are debuggable, which would let anyone with adb read
      # the feed list — and the Patreon URLs in it are bearer credentials.
      - name: Build the release APK
        run: ./gradlew assembleRelease --no-daemon

      # Android refuses to install an unsigned APK. With the release keystore in
      # secrets, builds upgrade over each other; without it, they don't - hence the
      # warning rather than a silent throwaway key.
      - name: Sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          unsigned=$(find app/build/outputs/apk/release -name '*-release-unsigned.apk' | head -1)
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ks="$RUNNER_TEMP/deadzone.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            pass="$KEYSTORE_PASS"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret - signing with a throwaway key. Users will have to uninstall any previous Deadzone before installing this build."
            pass=deadzone123
            keytool -genkeypair -keystore "$ks" -alias deadzone -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname 'CN=Deadzone, O=Deadzone, C=US'
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$ks" --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --out "Deadzone-$version.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "Deadzone-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: deadzone-android
          path: Deadzone-*.apk
          if-no-files-found: error

  # Separate job so the build can be read on its own, and so a tag publishes once.
  release:
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
